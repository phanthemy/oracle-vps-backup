<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <title>DauTayShop Sync</title>
  <style>
    body {
      width: 320px;
      margin: 0;
      padding: 16px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #fff;
      color: #333;
    }
    .header {
      display: flex;
      align-items: center;
      gap: 8px;
      border-bottom: 2px solid #ffe5ec;
      padding-bottom: 12px;
      margin-bottom: 14px;
    }
    .header h2 {
      margin: 0;
      font-size: 16px;
      color: #d90429;
    }
    .status-card {
      background: #fdf0f2;
      border-radius: 8px;
      padding: 12px;
      margin-bottom: 14px;
      font-size: 13px;
    }
    .status-row {
      display: flex;
      justify-content: space-between;
      margin-bottom: 6px;
    }
    .status-row:last-child {
      margin-bottom: 0;
    }
    .count-badge {
      font-weight: bold;
      color: #d90429;
      font-size: 14px;
    }
    .option-group {
      margin-bottom: 14px;
      font-size: 12px;
      color: #666;
    }
    .btn {
      display: block;
      width: 100%;
      padding: 10px;
      border: none;
      border-radius: 6px;
      font-weight: bold;
      font-size: 14px;
      cursor: pointer;
      text-align: center;
      transition: opacity 0.2s;
      box-sizing: border-box;
    }
    .btn:hover {
      opacity: 0.9;
    }
    .btn-primary {
      background: linear-gradient(135deg, #ff4d6d, #d90429);
      color: white;
      margin-bottom: 8px;
    }
    .btn-secondary {
      background: #f1f3f5;
      color: #495057;
      margin-bottom: 8px;
      font-size: 12px;
      padding: 8px;
    }
    .tip-box {
      background: #e7f5ff;
      border: 1px solid #a5d8ff;
      border-radius: 6px;
      padding: 8px;
      font-size: 11px;
      color: #1971c2;
      margin-bottom: 12px;
      line-height: 1.4;
    }
    .log-box {
      margin-top: 12px;
      padding: 8px;
      background: #f8f9fa;
      border-radius: 4px;
      font-size: 11px;
      color: #555;
      max-height: 80px;
      overflow-y: auto;
      border: 1px solid #dee2e6;
      display: none;
    }
  </style>
</head>
<body>
  <div class="header">
    <span style="font-size: 22px;">🍓</span>
    <h2>DauTayShop TikTok Sync</h2>
  </div>

  <div class="status-card">
    <div class="status-row">
      <span>Kết nối web:</span>
      <span style="color: #2b8a3e; font-weight: bold;">🟢 Sẵn sàng</span>
    </div>
    <div class="status-row">
      <span>Đã quét được:</span>
      <span class="count-badge" id="productCount">0 sản phẩm</span>
    </div>
  </div>

  <div class="tip-box" id="tipBox">
    💡 <b>Mẹo:</b> Khi vừa nạp lại tiện ích, hãy bấm <b>F5 (Tải lại trang TikTok)</b> để tiện ích bắt dữ liệu sản phẩm.
  </div>

  <div class="option-group">
    <label style="cursor: pointer; display: flex; align-items: center; gap: 6px;">
      <input type="checkbox" id="cleanFirst">
      <span>Xóa sạch sản phẩm cũ trên DauTayShop</span>
    </label>
  </div>

  <button class="btn btn-primary" id="btnSync">⚡ Đồng bộ về DauTayShop</button>
  <button class="btn btn-secondary" id="btnReloadTab">🔄 Tải lại trang TikTok (F5)</button>
  <button class="btn btn-secondary" id="btnClear" style="display: none;">🗑️ Xóa danh sách đã quét</button>

  <div id="logBox" class="log-box"></div>

  <script src="popup.js"></script>
</body>
</html>
