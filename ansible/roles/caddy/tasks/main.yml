---
- name: "Install Caddy web server keyring and repository"
  ansible.builtin.get_url:
    url: "https://dl.cloudsmith.io/public/caddy/stable/gpg.key"
    dest: "/usr/share/keyrings/caddy-stable-archive-keyring.gpg"
    mode: "0644"

- name: "Add Caddy debian source list"
  ansible.builtin.get_url:
    url: "https://dl.cloudsmith.io/public/caddy/stable/debian.deb.txt"
    dest: "/etc/apt/sources.list.d/caddy-stable.list"
    mode: "0644"

- name: "Install Caddy"
  ansible.builtin.apt:
    name: caddy
    state: present
    update_cache: true

- name: "Deploy Caddyfile configuration"
  ansible.builtin.copy:
    src: "../../../configs/caddy/Caddyfile"
    dest: "/etc/caddy/Caddyfile"
    mode: "0644"
  notify: "Reload Caddy"

- name: "Ensure Caddy service is enabled and started"
  ansible.builtin.systemd:
    name: caddy
    state: started
    enabled: true
